<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <title>Container Lab</title>
</head>

<body>
  <h1>Frontend (Nginx)</h1>

  <div id="msg">Loading...</div>

  <script>
    fetch('/api/status')
      .then(r => {
        if (!r.ok) {
          throw new Error('HTTP ' + r.status);
        }
        return r.json();
      })
      .then(d => {
        document.getElementById('msg').innerHTML =
          'Name: ' + d.name + '<br>' +
          'Database: ' + d.database + '<br>' +
          'Database time: ' + d.database_time + '<br>' +
          'Visits: ' + d.visits;
      })
      .catch(e => {
        document.getElementById('msg').textContent =
          'API error: ' + e;
      });
  </script>
</body>
</html>
